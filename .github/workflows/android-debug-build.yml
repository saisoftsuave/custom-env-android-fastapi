name: Android Debug Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x frontend/gradlew

      - name: Build Debug APK
        working-directory: frontend
        run: ./gradlew assembleDebug
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Upload Debug APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: frontend/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: debug-${{ github.run_number }}
          name: Debug Build #${{ github.run_number }}
          body: |
            Automated debug build from commit ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          files: frontend/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
